[project]
name = "dab-ai"
version = "0.1.0"
description = "AlphaZero training, self-play, and ONNX export for Dots and Boxes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dab-ai = "dab_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dab_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
